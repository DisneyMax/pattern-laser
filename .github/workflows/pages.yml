name: Test, build and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-laser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Build Pages and offline utility
        run: npm run build:pages
      - name: Verify links and generated JavaScript
        run: |
          python3 verify-pages.py
          node verify-runtime.mjs
      - name: Install Chromium for UI regression tests
        run: npx playwright install --with-deps chromium
      - name: Run Playwright UI regression suite
        run: npm run test:ui
      - name: Upload UI report, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages uses GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          current_source=$(gh api "repos/${GH_REPO}/pages" --jq .build_type)
          if [ "$current_source" != "workflow" ]; then
            echo "::error::Repository owner: open Settings > Pages > Build and deployment, select GitHub Actions as Source, then rerun this workflow."
            exit 1
          fi
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
